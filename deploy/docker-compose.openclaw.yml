services:
  muslim-bot:
    build:
      context: ../..
      dockerfile: muslim_bot/deploy/Dockerfile
    image: muslim-bot:openclaw
    container_name: muslim-bot
    restart: unless-stopped
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_ORGANIZATION: ${OPENAI_ORGANIZATION:-}
      OPENAI_PROJECT: ${OPENAI_PROJECT:-}
      RUNTIME_CONFIG_PATH: /app/data/runtime_config.json
      QURAN_SOURCE_DB_PATH: /app/seed/quran.db
      QURAN_DB_PATH: /app/data/quran.db
      HADITH_DB_PATH: /app/data/hadith.db
      QURAN_MCP_COMMAND: /app/bin/quran-mcp
      QURAN_MCP_ARGS: ""
      QURAN_MCP_CWD: /app
      HADITH_MCP_COMMAND: /app/bin/hadith-mcp
      HADITH_MCP_ARGS: ""
      HADITH_MCP_CWD: /app/hadith-api-go-run
      HADITH_SEEDER_COMMAND: /app/bin/hadith-seeder
      HADITH_SEEDER_ARGS: ""
      HADITH_SEEDER_CWD: /app/hadith-api-go-run
      MCP_STARTUP_TIMEOUT_SECONDS: ${MCP_STARTUP_TIMEOUT_SECONDS:-45}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-300}
      AGENT_MAX_TURNS: ${AGENT_MAX_TURNS:-10}
      SESSION_MAX_TURNS: ${SESSION_MAX_TURNS:-12}
      SESSION_DB_PATH: /app/data/sessions.db
      SESSION_RETENTION_DAYS: ${SESSION_RETENTION_DAYS:-7}
      CHAT_RATE_LIMIT_PER_MINUTE: ${CHAT_RATE_LIMIT_PER_MINUTE:-30}
      CHAT_CACHE_ENABLED: ${CHAT_CACHE_ENABLED:-true}
      ANSWER_CACHE_TTL_DAYS: ${ANSWER_CACHE_TTL_DAYS:-7}
      AGENT_PIPELINE_ENABLED: ${AGENT_PIPELINE_ENABLED:-true}
      AGENT_PARALLEL_TOOL_CALLS: ${AGENT_PARALLEL_TOOL_CALLS:-true}
      MCP_HEALTH_CHECK_INTERVAL_SECONDS: ${MCP_HEALTH_CHECK_INTERVAL_SECONDS:-30}
      SEMANTIC_SEARCH_ENABLED: ${SEMANTIC_SEARCH_ENABLED:-true}
      SEMANTIC_AUTO_INDEX: ${SEMANTIC_AUTO_INDEX:-true}
      SEMANTIC_DB_PATH: /app/data/semantic.db
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-512}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - muslim_bot_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  telegram-bot:
    image: muslim-bot:openclaw
    container_name: muslim-bot-telegram
    restart: unless-stopped
    command: ["python", "-m", "muslim_bot.telegram_bot"]
    depends_on:
      muslim-bot:
        condition: service_healthy
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_API_BASE: http://muslim-bot:8000

volumes:
  muslim_bot_data:
